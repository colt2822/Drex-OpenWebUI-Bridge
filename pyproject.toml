[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openwebui-drex-chat"
version = "0.1.0"
description = "Natural-language Nace.AI Drex integration for OpenWebUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["fastapi>=0.110,<1", "httpx>=0.27,<1", "pydantic>=2.6,<3", "uvicorn>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[project.scripts]
drex-chat-bridge = "drex_chat.server:main"

[tool.setuptools.packages.find]
include = ["drex_chat*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
